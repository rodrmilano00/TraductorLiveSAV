<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=834,initial-scale=1,user-scalable=no"/>
<title>Reproducción — Señas a Voces Academy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#FDFBF7;--card:#FFFFFF;--muted:#EFECE6;
  --primary:#E0702B;--secondary:#7C4023;--teal:#11525A;
  --text:#2A323D;--text-muted:#6B7280;
  --radius:20px;--radius-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:834px;height:1194px;overflow:hidden;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

.status-bar{height:54px;padding:14px 24px 0;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600}
.status-bar .time{font-weight:700}
.status-bar .icons{display:flex;gap:8px;align-items:center}
.status-bar .icons svg{width:18px;height:18px}

.content{display:flex;flex-direction:column;align-items:center;padding:32px 48px;height:calc(1194px - 54px - 34px);overflow-y:auto}

.screen-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--primary);margin-bottom:8px;align-self:flex-start}

.option-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;background:#FEF3EC;border-radius:999px;font-size:14px;font-weight:600;color:var(--primary);margin-bottom:32px;margin-top:8px}
.option-badge .dot{width:10px;height:10px;border-radius:50%;background:var(--primary);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.player-card{width:100%;background:var(--card);border-radius:var(--radius);border:1px solid var(--muted);overflow:hidden;margin-bottom:24px}

.player-header{padding:20px 24px;border-bottom:1px solid var(--muted);display:flex;align-items:center;justify-content:space-between}
.player-header h2{font-size:20px;font-weight:700}
.player-header .status{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#16A34A}
.player-header .status .dot{width:8px;height:8px;border-radius:50%;background:#16A34A;animation:pulse 1.5s infinite}

.waveform-container{padding:24px 24px 16px}
.waveform{display:flex;align-items:center;justify-content:center;gap:3px;height:80px}
.waveform .bar{width:5px;border-radius:3px;background:var(--primary);animation:waveAnim 1.2s ease-in-out infinite}
@keyframes waveAnim{0%,100%{height:8px}50%{height:64px}}

.progress-bar{padding:0 24px 20px}
.progress-track{width:100%;height:6px;background:var(--muted);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--primary);border-radius:3px;width:45%;transition:width .3s}
.progress-time{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;font-weight:600;color:var(--text-muted);font-variant-numeric:tabular-nums}

.phrase-card{width:100%;background:var(--card);border-radius:var(--radius);border:1px solid var(--muted);padding:24px;margin-bottom:24px}
.phrase-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);margin-bottom:12px}
.phrase-text{font-size:22px;font-weight:600;line-height:1.5;letter-spacing:-.01em}

.controls{display:flex;gap:12px;width:100%}
.ctrl-btn{flex:1;padding:18px;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.ctrl-btn.play{background:var(--primary);color:#fff;box-shadow:0 4px 16px rgba(224,112,43,.25)}
.ctrl-btn.play:hover{box-shadow:0 6px 24px rgba(224,112,43,.35)}
.ctrl-btn.secondary{background:var(--muted);color:var(--text)}
.ctrl-btn.secondary:hover{background:#E5E2DB}

.player-visual{padding:20px 24px;display:flex;align-items:center;gap:16px;border-top:1px solid var(--muted)}
.player-icon{width:48px;height:48px;border-radius:12px;background:#FEF3EC;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.player-icon svg{width:24px;height:24px;color:var(--primary)}
.player-info h3{font-size:16px;font-weight:700;margin-bottom:2px}
.player-info p{font-size:13px;color:var(--text-muted)}

.bottom-indicator{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:134px;height:5px;background:#2A323D;border-radius:999px}
</style>
</head>
<body>

<div class="status-bar">
  <span class="time">9:41</span>
  <span class="icons">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0114.08 0M1.42 9a16 16 0 0121.16 0M8.53 16.11a6 6 0 016.95 0M12 20h.01"/></svg>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="6" width="18" height="12" rx="2"/><line x1="23" y1="13" x2="23" y2="11"/></svg>
  </span>
</div>

<div class="content">
  <div class="screen-label">Pantalla 03</div>

  <div class="option-badge">
    <span class="dot"></span>
    Opción 3 — Reproduciendo
  </div>

  <div class="player-card">
    <div class="player-header">
      <h2>Reproducción de audio</h2>
      <div class="status">
        <span class="dot"></span>
        En reproducción
      </div>
    </div>

    <div class="player-visual">
      <div class="player-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </div>
      <div class="player-info">
        <h3>Opción 3 — Realizar un pedido</h3>
        <p>Audio generado por el sistema</p>
      </div>
    </div>

    <div class="waveform-container">
      <div class="waveform" id="waveform"></div>
    </div>

    <div class="progress-bar">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-time">
        <span id="currentTime">0:02</span>
        <span>0:05</span>
      </div>
    </div>
  </div>

  <div class="phrase-card">
    <div class="phrase-label">Frase que se está reproduciendo</div>
    <div class="phrase-text">"Realizar un pedido para llevar, por favor"</div>
  </div>

  <div class="controls">
    <button class="ctrl-btn secondary" onclick="this.textContent=this.textContent==='Reiniciar'?'Reproduciendo...':'Reiniciar'">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
      Reiniciar
    </button>
    <button class="ctrl-btn play" id="playBtn" onclick="togglePlay()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Pausar
    </button>
  </div>
</div>

<div class="bottom-indicator"></div>

<script>
// Generate waveform bars
(function(){
  var w=document.getElementById('waveform');
  for(var i=0;i<36;i++){
    var b=document.createElement('div');
    b.className='bar';
    b.style.animationDelay=(i*0.04)+'s';
    b.style.height=(8+Math.random()*56)+'px';
    w.appendChild(b);
  }
})();

// Animate progress
var progress=45;
var playing=true;
var fill=document.getElementById('progressFill');
var timeEl=document.getElementById('currentTime');
setInterval(function(){
  if(!playing)return;
  progress+=0.5;
  if(progress>100)progress=0;
  fill.style.width=progress+'%';
  var sec=Math.floor(progress*5/100);
  timeEl.textContent='0:0'+sec;
},200);

function togglePlay(){
  playing=!playing;
  var btn=document.getElementById('playBtn');
  btn.innerHTML=playing
    ?'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> Pausar'
    :'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> Reanudar';
  document.querySelectorAll('.waveform .bar').forEach(function(b){
    b.style.animationPlayState=playing?'running':'paused';
  });
}
</script>
</body>
</html>
